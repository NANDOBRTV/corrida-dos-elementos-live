name: QA visual Android — sem LIVE real
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de QA
        run: npm install --include=dev --no-audit --no-fund
      - name: Instalar Chromium e bibliotecas do sistema
        run: npx playwright install --with-deps chromium
      - name: Testar cinco biomas, Android e sincronização
        env:
          CI: 'true'
          TIKTOK_LIVE_MODE: disabled
        run: npm run test:browser
      - name: Guardar screenshots e relatórios para análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrida-qa-visual
          path: |
            e2e-artifacts/
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
